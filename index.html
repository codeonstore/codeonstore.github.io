    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }

input[type=number]::-webkit-inner-spin-button, 
input[type=number]::-webkit-outer-spin-button {

    margin: 0;

/* Efek memantul untuk ikon saat tab aktif */
@keyframes navActiveIcon {
    0% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-6px) scale(1.25); }
    100% { transform: translateY(-4px) scale(1.15); }
}

/* Efek munculnya latar belakang (pill) saat tab aktif */
@keyframes navActivePill {
    0% { transform: scale(0.6); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
}

/* Efek turunnya garis indikator atas */
@keyframes navActiveLine {
    0% { transform: translate(-50%, -100%); opacity: 0; }
    100% { transform: translate(-50%, 0); opacity: 1; }
}

.nav-icon-active {
    animation: navActiveIcon 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
}
.nav-pill-active {
    animation: navActivePill 0.3s ease-out forwards;
}
.nav-line-active {
    animation: navActiveLine 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
}
/* Efek Bola (Orb) melompat keluar dari navbar */
@keyframes orbPopOut {
    0% { transform: translateY(15px) scale(0.3); opacity: 0; }
    50% { transform: translateY(-30px) scale(1.1); opacity: 1; }
    100% { transform: translateY(-26px) scale(1); opacity: 1; } /* Dinaikkan agar tidak menabrak teks */
}

/* Efek Teks meluncur dari bawah */
@keyframes textSlideUp {
    0% { transform: translateY(10px); opacity: 0; }
    100% { transform: translateY(0); opacity: 1; }
}

.nav-orb-active {
    animation: orbPopOut 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
}

.nav-text-active {
    animation: textSlideUp 0.4s ease-out forwards;
    animation-delay: 0.1s; /* Memberi jeda sedikit agar bola naik duluan */
}

    /* CSS KHUSUS POSTER QRIS RESPONSIVE */
    #qris-poster-capture {
        background: #fff; 
        padding: 10px 12px 40px 12px; /* Diubah agar lebih seimbang */
        position: relative;
        overflow: hidden; 
        text-align: center; 
        border-radius: 16px 16px 0 0;
        width: 100%;
        max-width: 100%;
        box-sizing: border-box;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    #qrcode-container img, 
    #qrcode-container canvas {
        max-width: 100% !important;
        height: auto !important;
        margin: 0 auto;
    }

    .poster-shape-bottom {
        position: absolute; right: -110px; bottom: -110px; width: 220px; height: 220px; 
        background: linear-gradient(135deg, #0a1c3a 0%, #64b5f6 50%, #1e3c72 100%); 
        transform: rotate(45deg); z-index: 1;
    }
    .poster-shape-top {
        position: absolute; left: -200px; top: 70px; width: 300px; height: 300px; 
        background: linear-gradient(135deg, #0a1c3a 0%, #64b5f6 50%, #1e3c72 100%); 
        transform: rotate(45deg); z-index: 1;
    }
    .poster-content { position: relative; z-index: 5; }
    
    #qrcode-container {
        background: white; padding: 10px; display: inline-block; border-radius: 12px; margin-top: 5px; margin-bottom: 0px; position: relative; z-index: 10; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
